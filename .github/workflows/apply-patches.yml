name: Apply Patches

on:
  push:
    branches:
      - patches
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout patches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: patches
          persist-credentials: false

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main
          fetch-depth: 0
          token: ${{ secrets.PATCHES_PUSH_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: main/package.json

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: main/.nvmrc

      - name: Authenticate GitHub Package Registry
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      - name: Configure Git
        working-directory: main
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_LOGIN: github-actions[bot]
        run: |
          BOT_ID=$(gh api "users/$BOT_LOGIN" --jq .id)
          git config user.name "$BOT_LOGIN"
          git config user.email "$BOT_ID+$BOT_LOGIN@users.noreply.github.com"

      - name: Apply patches
        working-directory: main
        run: ../patches/run.sh

      - name: Check for changes
        id: diff
        working-directory: main
        run: |
          if git diff --quiet origin/main HEAD; then
            echo "No changes compared to origin/main"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git --no-pager diff --stat origin/main HEAD
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to main
        if: github.event_name == 'workflow_dispatch' || steps.diff.outputs.changed == 'true'
        working-directory: main
        run: git push --force-with-lease=main:origin/main origin HEAD:main
